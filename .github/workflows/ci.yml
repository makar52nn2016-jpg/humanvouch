name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install workspace deps
        run: yarn install --frozen-lockfile

      - name: Nuxt prepare
        run: yarn workspace @humanvouch/web run postinstall

      - name: Typecheck Nuxt app
        run: yarn workspace @humanvouch/web run typecheck
